data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv

target: spoilage_pct

features:
  numeric:
    - storage_days
    - temp_set_c
    - humidity_pct
    - power_cuts_hours
    - bag_weight_kg
    - door_openings_per_day
  categorical:
    - crop
    - chamber

model:
  random_state: 42
  cv_folds: 5
  candidates:              # every candidate becomes one MLflow run
    - name: ridge
      type: ridge
      alpha: 1.0
    - name: rf_200_d8
      type: random_forest
      n_estimators: 200
      max_depth: 8
    - name: gbr_300_lr005
      type: gradient_boosting
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 3
    - name: gbr_500_lr003
      type: gradient_boosting
      n_estimators: 500
      learning_rate: 0.03
      max_depth: 2

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp049-spoilage
  registered_model_name: mp049-spoilage-model

monitoring:
  psi_bins: 10
  retrain_fraction: 0.7
  promotion_min_improvement: 0.10

outputs:
  model: models/model.joblib
  findings: reports/findings.yaml
  predictions: predictions/holdout_predictions.csv
